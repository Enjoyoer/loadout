name: Bug report
description: A skill, the fleet sync, or a plugin does the wrong thing.
labels: [bug, triage]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Skill, Fleet sync, Paseo plugin, Docs, Other]
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Skill, script, or plugin name
      placeholder: e.g. opc, sync.py, merged-worker-archiver
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands and output. Remove host names, paths, tokens, and other private data first.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Loadout commit or release, client (Claude Code / Codex) version, Paseo version, OS
