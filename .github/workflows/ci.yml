name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    name: Repo tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # manifest verification and sync tests read committed history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify the publication manifest
        run: python3 scripts/verify_manifest.py
      - name: Validate the opc package
        run: node skills/orchestration/opc/scripts/validate-opc.mjs skills/orchestration/opc
      - name: Repo tests
        run: python3 -m unittest discover -s tests

  plugins:
    name: Plugin ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [cache-aware-autocompact, merged-worker-archiver, orphan-project-sweeper, usage-limit-auto-resume]
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      - name: Check
        run: if npm run | grep -q '^  check$'; then npm run check; else npm run typecheck; fi
