name: CI

on:
  push:
    # Every pushed branch gets the secret scan; the other jobs run only for main and pull requests.
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    name: Repo tests (${{ matrix.os }})
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # manifest verification and sync tests read committed history
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Verify the publication manifest
        run: python3 scripts/verify_manifest.py
      - name: Validate the opc package
        run: node skills/orchestration/opc/scripts/validate-opc.mjs skills/orchestration/opc
      - name: Validate the opn package
        run: python3 skills/orchestration/opn/scripts/validate-opn.py
      - name: Repo tests
        run: python3 -m unittest discover -s tests
      - name: Probe the paseo catalog spawn (temporary)
        if: always() && runner.os == 'Windows'
        run: |
          $fake = Join-Path $env:RUNNER_TEMP 'fake-paseo'
          New-Item -ItemType Directory -Force $fake | Out-Null
          Set-Content -Path (Join-Path $fake 'paseo.cmd') -Value '@echo [{"id":"x","label":"X","thinkingOptions":[]}]'
          $env:PATH = "$fake;$env:PATH"
          $scripts = 'skills/orchestration/opc/scripts'
          git show "origin/main:$scripts/route.mjs" | Set-Content "$scripts/route-main.mjs"
          $main = node "$scripts/route-main.mjs" --class planner 2>&1 | Out-String
          $branch = node --throw-deprecation "$scripts/route.mjs" --class planner 2>&1 | Out-String
          Remove-Item "$scripts/route-main.mjs"
          Write-Output "--- main:" $main "--- branch:" $branch
          if ($main -notmatch 'DEP0190') { throw 'main did not reproduce DEP0190' }
          if ($branch -match 'DEP0190' -or $branch -notmatch 'catalog label Web Pro') { throw 'branch probe failed' }
          $global:LASTEXITCODE = 0

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, as listed in the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans commits, not the working tree
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan commits
        env:
          # A pull request scans its own commits; a push to main scans all of main.
          LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD' }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A push to any other branch scans that push's own commits. A new branch (all-zero
          # before), or a force push whose old tip was not fetched, scans the commits not on main.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            if [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              LOG_OPTS="$BEFORE..$GITHUB_SHA"
            else
              LOG_OPTS="origin/main..$GITHUB_SHA"
            fi
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --log-opts="$LOG_OPTS" .

  plugins:
    # Ubuntu legs keep their original check names, which branch protection may require.
    name: Plugin ${{ matrix.plugin }}${{ matrix.os != 'ubuntu-latest' && format(' ({0})', matrix.os) || '' }}
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        plugin: [cache-aware-autocompact, merged-worker-archiver, orphan-project-sweeper, pi-fast-toggle, pm-native-worker-guard, usage-limit-auto-resume]
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      - name: Check
        run: npm run check
